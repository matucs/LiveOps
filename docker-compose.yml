services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-liveops}
      POSTGRES_USER: ${POSTGRES_USER:-liveops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-liveops_dev_password}
    ports:
      - "5434:5432"
    volumes:
      - liveops_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-liveops} -d ${POSTGRES_DB:-liveops}"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Local-only observability (ADR-011). Opt in with:
  #   docker compose --profile observability up -d
  # Never run in production — the deployed VM has ~1GB RAM total and no
  # headroom for a trace backend alongside the app stack; see
  # docs/observability.md for what production gets instead (structured
  # JSON logs with trace/span IDs, no trace UI).
  jaeger:
    image: jaegertracing/all-in-one:1.60
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4318:4318"   # OTLP HTTP receiver

  # Local-only Kafka-compatible transport for the V2 migration (ADR-002,
  # ADR-013). Redpanda, not Apache Kafka: a single binary speaking the
  # real Kafka wire protocol, so KafkaEventBus is genuinely a Kafka
  # client — no separate Zookeeper/broker cluster needed for a demo of
  # this size. Opt in with:
  #   docker compose --profile kafka up -d
  # Local only, matching Jaeger above — not part of the production
  # deployment (ADR-002's decision to keep V1 on Postgres holds; this
  # profile exists to produce the before/after measurement that decision
  # promised, not to replace it).
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    restart: unless-stopped
    profiles: ["kafka"]
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  liveops_pg_data:
